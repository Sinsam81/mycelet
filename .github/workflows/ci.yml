name: ci

# Porten inn til main.
#
# Fram til nå var gitleaks den ENESTE workflowen i repoet: verken tsc, vitest,
# eslint eller next build gjennomførte en merge. `docs/reports/deploys.md`
# innleder likevel med at «alle kodeendringer ble verifisert med typecheck, full
# Vitest-suite og produksjonsbygg før merge» — det var en manuell vane, ikke en
# maskin. Vercel publiserer det som lander i main uansett, så én PR som glemte å
# kjøre testene lokalt gikk rett til betalende kunder.
#
# Hele denne porten koster under to minutter.
#
# Regelsettet «main-porten» krever denne jobben (siden 2026-08-02). Build-steget
# ligger INNE i samme jobb med vilje: et eget jobbnavn måtte legges til i
# regelsettet manuelt, og fram til det var gjort ville det ikke stoppet noe.
#
# `next build` sto lenge utenfor med begrunnelsen «trenger Supabase-nøkler ved
# prerender». Det er ikke sant lenger: nesten alle sider er dynamiske (locale-
# oppslaget leser cookies), så bygget kjører uten env — verifisert 2026-09-05
# på en ren utsjekking. Det build fanger som tsc/vitest ikke gjør: Turbopack-
# resolve-feil, `ssr:false` i en Server Component, next.config-/Sentry-feil,
# kast i modulskop under prerender av de få statiske rutene.
#
# `npm run qa` / `qa:prod` hører IKKE hjemme her — de treffer produksjon.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `npm run test` starter vitest i watch-modus; --run gjør den til
      # engangskjøring, ellers henger jobben til timeout.
      - name: Tests
        run: npm run test -- --run

      - name: Production build
        run: npm run build
        env:
          # Ingen kildekart-opplasting fra CI — bare Vercel-bygget skal
          # registrere en release i Sentry.
          SENTRY_AUTH_TOKEN: ''
